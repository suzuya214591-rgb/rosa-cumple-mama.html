<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌹 Feliz cumpleaños, mamá</title>
<meta name="description" content="Una rosa en 3D hecha con código que florece para desearle feliz cumpleaños a la mamá más linda del mundo.">
<meta name="theme-color" content="#050002">
<meta property="og:title" content="Feliz cumpleaños, mamá 🌹">
<meta property="og:description" content="Una rosa hecha con código, solo para ti.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@500;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --rose:#ff2e5e; --rose-deep:#ff0044; --gold:#f2c35b; --text-soft:#b5a2b0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif}
body{background:#020002;background:radial-gradient(ellipse at 50% 75%,#120105 0%,#050002 55%,#000 100%);display:flex;align-items:center;justify-content:center}

.vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.9) 100%);z-index:100;pointer-events:none}
.spotlight{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);width:85vw;height:85vh;background:radial-gradient(circle,rgba(255,30,80,.06) 0%,transparent 70%);filter:blur(50px);pointer-events:none;z-index:1}

/* ===== Tarjeta inicial ===== */
.trigger-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);z-index:200;opacity:1;visibility:visible;transition:opacity .8s cubic-bezier(.25,1,.5,1),visibility .8s}
.trigger-overlay.fade-out{opacity:0;visibility:hidden;pointer-events:none}
.glass-card{position:relative;width:min(85vw,340px);background:rgba(22,10,15,.55);border:1px solid rgba(255,40,100,.2);border-radius:24px;padding:35px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.6),0 0 40px rgba(255,30,80,.1);transition:transform .6s cubic-bezier(.34,1.56,.64,1);overflow:hidden}
.trigger-overlay.fade-out .glass-card{transform:scale(.85)}
.card-glow{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,30,80,.15) 0%,transparent 70%);top:-40px;left:-40px;filter:blur(15px);pointer-events:none}
.rose-icon{font-size:54px;margin-bottom:12px;filter:drop-shadow(0 4px 12px rgba(255,30,80,.4));animation:pulseIcon 2s ease-in-out infinite}
@keyframes pulseIcon{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.glass-card .title{color:#fff;font-family:'Playfair Display',serif;font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:22px}
.loading-bar-container{width:100%;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:10px}
.loading-bar{width:0%;height:100%;background:linear-gradient(to right,var(--rose),var(--gold));border-radius:3px;transition:width .1s linear}
.status-text{font-size:12px;color:var(--text-soft);font-family:'Fira Code',monospace;margin-bottom:26px;min-height:1.4em}
.start-button{position:relative;width:100%;padding:16px;background:linear-gradient(135deg,var(--rose) 0%,var(--rose-deep) 100%);border:none;border-radius:12px;color:#fff;font:700 14px 'Inter',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;overflow:hidden;transition:transform .2s,box-shadow .2s;box-shadow:0 5px 20px rgba(255,0,68,.3)}
.start-button:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3);cursor:not-allowed;box-shadow:none;transform:none!important}
.start-button:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,0,68,.5),0 0 15px rgba(255,50,90,.3)}
.start-button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-shine{position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(to right,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-25deg)}
.start-button:not(:disabled) .btn-shine{animation:shine 1.8s ease-in-out infinite}
@keyframes shine{100%{left:150%}}

.ambient-light{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(255,30,60,.10) 0%,rgba(255,20,50,.04) 40%,transparent 65%);top:32%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;opacity:0;transition:opacity 3s ease}
.ambient-light.visible{opacity:1}

/* ===== Escena 3D ===== */
.scene{perspective:1200px;perspective-origin:50% 35%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding-bottom:12vh;z-index:20;transform:scale(var(--scene-scale,.95))}
.rose-wrapper{transform-style:preserve-3d;position:relative;width:300px;height:480px;transform:rotateX(-22deg) rotateY(0deg);will-change:transform}
.rose-wrapper.rotating{animation:rotateRose 28s linear infinite}
@keyframes rotateRose{from{transform:rotateX(-22deg) rotateY(0deg)}to{transform:rotateX(-22deg) rotateY(360deg)}}

.stem-group{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:10px;height:250px;transform-style:preserve-3d}
.stem{position:absolute;bottom:0;left:0;width:100%;height:0%;background:linear-gradient(to top,#092e12 0%,#114c23 30%,#1a6f35 70%,#114c23 100%);border-radius:5px;transition:height 2.2s cubic-bezier(.22,1,.36,1);overflow:hidden}
.stem.grow{height:100%}
.stem-highlight{position:absolute;top:0;left:1px;width:2.5px;height:100%;background:linear-gradient(to bottom,transparent,rgba(150,255,180,.15),transparent)}
.thorn{position:absolute;width:11px;height:6px;opacity:0;transition:opacity .5s ease .4s;z-index:2}
.thorn::before{content:'';position:absolute;width:100%;height:100%;background:linear-gradient(135deg,#1a6f35,#092e12);clip-path:polygon(0% 85%,100% 50%,30% 0%)}
.thorn-1{right:-9px;bottom:65%;transform:scaleX(-1)}
.thorn-2{left:-9px;bottom:42%}
.stem.grow~.thorn{opacity:.75}
.leaf{position:absolute;width:52px;height:25px;opacity:0;transition:opacity .6s ease,transform 1.1s cubic-bezier(.34,1.45,.64,1);z-index:2}
.leaf::before{content:'';position:absolute;width:100%;height:100%;background:linear-gradient(160deg,#2a944e 0%,#1a6f35 40%,#092e12 100%)}
.leaf-vein{position:absolute;width:60%;height:1px;background:rgba(150,255,180,.12);top:48%;left:20%;z-index:1}
.leaf-left{left:-52px;bottom:56%;transform-origin:right center;transform:rotate(35deg) scale(0)}
.leaf-left::before{border-radius:65% 2px 65% 2px}
.leaf-right{left:10px;bottom:38%;transform-origin:left center;transform:rotate(-35deg) scale(0)}
.leaf-right::before{border-radius:2px 65% 2px 65%}
.leaf.visible{opacity:1}
.leaf-left.visible{transform:rotate(15deg) scale(1)}
.leaf-right.visible{transform:rotate(-15deg) scale(1)}

.calyx{position:absolute;bottom:242px;left:50%;transform:translateX(-50%);width:0;height:0;transform-style:preserve-3d;z-index:1}
.sepal{position:absolute;bottom:-4px;left:50%;width:14px;height:32px;transform-origin:50% 100%;background:linear-gradient(to top,#092e12 0%,#15582b 40%,#299c4c 100%);border-radius:50% 50% 10% 10%/80% 80% 20% 20%;clip-path:polygon(10% 100%,0% 30%,50% 0%,100% 30%,90% 100%);opacity:0;transform:translateX(-50%) rotateY(var(--sepal-angle,0deg)) rotateX(60deg) scale(.5);transition:transform 1.3s cubic-bezier(.25,1,.5,1) var(--sepal-delay,0s),opacity .5s ease var(--sepal-delay,0s)}
.calyx.visible .sepal{opacity:.95;transform:translateX(-50%) rotateY(var(--sepal-angle,0deg)) rotateX(var(--sepal-curl,22deg)) scale(1)}

.rose-head{position:absolute;bottom:245px;left:50%;transform:translateX(-50%);width:0;height:0;transform-style:preserve-3d;z-index:10}
.rose-glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(160,5,30,.18) 0%,rgba(100,0,20,.05) 45%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity 3.5s ease;z-index:-1;pointer-events:none}
.rose-glow-inner{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(180,40,60,.15) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity 2s ease .8s;z-index:-1;pointer-events:none}
.rose-head.blooming .rose-glow,.rose-head.blooming .rose-glow-inner{opacity:1}

.petal{position:absolute;bottom:0;left:50%;transform-origin:50% 100%;opacity:.002;border-radius:50% 50% 35% 35%/45% 45% 55% 55%;
  transform:translateX(-50%) rotateY(var(--angle,0deg)) translateZ(0px) rotateX(90deg) scale(.1);
  transition:transform var(--bloom-dur,2.4s) ease-in-out var(--delay,0s),opacity .7s ease var(--delay,0s)}
.rose-head.blooming .petal{opacity:1;transform:translateX(-50%) rotateY(var(--angle,0deg)) translateZ(var(--tz,0px)) rotateX(var(--curl,30deg)) scale(var(--scale,1))}
.petal-bud{background:linear-gradient(to bottom,#3d0008 0%,#220003 40%,#100001 75%,#040000 100%)}
.petal-core{background:linear-gradient(to bottom,#52000c 0%,#350005 40%,#1a0002 75%,#080000 100%)}
.petal-inner{background:linear-gradient(to bottom,#6d0012 0%,#480008 40%,#250003 75%,#0c0000 100%)}
.petal-mid-inner{background:linear-gradient(to bottom,#850018 0%,#5c000d 40%,#310004 75%,#120000 100%)}
.petal-mid{background:linear-gradient(to bottom,#9a001d 0%,#6e0011 40%,#3b0005 75%,#160000 100%)}
.petal-outer{background:linear-gradient(to bottom,#ad0022 0%,#7e0014 40%,#440007 75%,#1a0001 100%)}
.petal-blush{background:linear-gradient(to bottom,#bf0028 0%,#8e0018 40%,#4e0008 75%,#1e0001 100%)}

/* ===== Pétalos y confeti que caen ===== */
.falling-petal{position:fixed;width:var(--fp-w,13px);height:var(--fp-h,17px);background:radial-gradient(ellipse at 40% 30%,var(--fp-c1,#9a001d),var(--fp-c2,#3d0008) 75%);border-radius:50% 50% 45% 55%/60% 60% 40% 40%;opacity:0;pointer-events:none;z-index:50;animation:fallSway var(--f-dur,7s) linear var(--f-delay,0s) forwards}
.falling-petal.confetti{border-radius:2px;background:var(--fp-c1)}
@keyframes fallSway{
  0%{opacity:0;transform:translateX(0) translateY(0) rotate(0deg) rotateY(0deg) scale(1)}
  8%{opacity:.85}
  25%{transform:translateX(var(--s1,35px)) translateY(20vh) rotate(70deg) rotateY(40deg) scale(.95)}
  50%{transform:translateX(var(--s2,-25px)) translateY(48vh) rotate(160deg) rotateY(90deg) scale(.88)}
  75%{transform:translateX(var(--s3,35px)) translateY(75vh) rotate(270deg) rotateY(150deg) scale(.78);opacity:.55}
  100%{opacity:0;transform:translateX(var(--s4,10px)) translateY(108vh) rotate(390deg) rotateY(210deg) scale(.55)}
}

/* ===== Mensaje final ===== */
.end-text{position:fixed;bottom:calc(6% + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(92vw,560px);text-align:center;opacity:0;transition:opacity 2s ease;z-index:60}
.end-text.visible{opacity:1}
.tagline{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(22px,6.5vw,36px);color:rgba(255,195,215,.95);letter-spacing:2px;text-shadow:0 0 25px rgba(255,80,130,.4),0 0 60px rgba(255,50,100,.15);margin-bottom:6px}
.subline{font-family:'Playfair Display',serif;font-size:clamp(14px,3.8vw,18px);color:rgba(255,220,230,.75);margin-bottom:10px;opacity:0;transition:opacity 2s ease 1.2s}
.end-text.visible .subline{opacity:1}
.rose-emoji{font-size:32px;display:block;animation:floatEmoji 3s ease-in-out infinite}
@keyframes floatEmoji{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Escala en .scene para que no choque con la rotación de .rose-wrapper */
@media (max-width:480px){:root{--scene-scale:.8}}
@media (max-height:600px){:root{--scene-scale:.65}.end-text{bottom:3%}}
@media (prefers-reduced-motion:reduce){
  .rose-wrapper.rotating,.rose-icon,.rose-emoji{animation:none}
}
</style>
</head>
<body>
<div class="vignette" aria-hidden="true"></div>
<div class="spotlight" aria-hidden="true"></div>
<div class="ambient-light" id="ambientLight" aria-hidden="true"></div>

<div class="trigger-overlay" id="triggerOverlay">
  <div class="glass-card">
    <div class="card-glow"></div>
    <div class="rose-icon" aria-hidden="true">🎂</div>
    <h2 class="title">Cumpleaños.css</h2>
    <div class="loading-bar-container"><div class="loading-bar" id="loadingBar"></div></div>
    <p class="status-text" id="statusText">Preparando la sorpresa...</p>
    <button class="start-button" id="startButton" type="button" disabled>
      <span class="btn-text">Cargando...</span>
      <span class="btn-shine"></span>
    </button>
  </div>
</div>

<main class="scene">
  <div class="rose-wrapper" id="roseWrapper" aria-label="Rosa en 3D">
    <div class="stem-group">
      <div class="stem" id="stem"><div class="stem-highlight"></div></div>
      <div class="thorn thorn-1"></div>
      <div class="thorn thorn-2"></div>
      <div class="leaf leaf-left" id="leafLeft"><div class="leaf-vein"></div></div>
      <div class="leaf leaf-right" id="leafRight"><div class="leaf-vein"></div></div>
    </div>
    <div class="calyx" id="calyx"></div>
    <div class="rose-head" id="roseHead">
      <div class="rose-glow"></div>
      <div class="rose-glow-inner"></div>
    </div>
  </div>
</main>

<footer class="end-text" id="endText" aria-live="polite">
  <h1 class="tagline" id="tagline"></h1>
  <p class="subline" id="subline"></p>
  <span class="rose-emoji" aria-hidden="true">🌹</span>
</footer>

<div id="fallingPetals" aria-hidden="true"></div>

<script>
/* ====== EDITA AQUÍ ====== */
const CONFIG = {
  titulo: "feliz cumpleaños, mamá",
  subtitulo: "a la mamá más linda del mundo, te amo con todo mi corazón",
  musica: true
};
/* ======================== */

(() => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);

  $('tagline').textContent = CONFIG.titulo;
  $('subline').textContent = CONFIG.subtitulo;

  /* ---- 1. Construir la rosa por capas ---- */
  const layers = [
    // clase,           pétalos, ancho, alto, tz, curl, escala
    ['petal-bud',        5, 20, 30,  0,  6, 1.00],
    ['petal-core',       6, 28, 38,  3, 14, 1.00],
    ['petal-inner',      7, 38, 48,  6, 24, 1.00],
    ['petal-mid-inner',  8, 48, 58,  9, 36, 1.00],
    ['petal-mid',        8, 56, 64, 12, 50, 1.02],
    ['petal-outer',      9, 64, 70, 14, 64, 1.04],
    ['petal-blush',     10, 70, 72, 16, 78, 1.06]
  ];
  const head = $('roseHead');
  layers.forEach(([cls, n, w, h, tz, curl, scale], li) => {
    const offset = li * 17;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'petal ' + cls;
      p.style.cssText =
        `width:${w}px;height:${h}px;` +
        `--angle:${(360 / n) * i + offset}deg;--tz:${tz}px;` +
        `--curl:${curl + rand(-4, 4)}deg;--scale:${scale};` +
        `--delay:${((layers.length - 1 - li) * .22 + i * .03).toFixed(2)}s;` +
        `--bloom-dur:${(2.2 + li * .15).toFixed(2)}s;z-index:${layers.length - li}`;
      head.appendChild(p);
    }
  });

  /* ---- 2. Sépalos ---- */
  const calyx = $('calyx');
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'sepal';
    s.style.cssText = `--sepal-angle:${i * 72}deg;--sepal-curl:${rand(95, 115)}deg;--sepal-delay:${i * .08}s`;
    calyx.appendChild(s);
  }

  /* ---- 3. Barra de carga ---- */
  const steps = [
    'Preparando la sorpresa...',
    'import { amor } from "corazon";',
    'mama.edad++;',
    'encendiendo velitas... 🕯️',
    'cultivando una rosa... 🌱',
    '¡Todo listo! 💖'
  ];
  const bar = $('loadingBar'), status = $('statusText'), btn = $('startButton');
  let pct = 0;
  const load = setInterval(() => {
    pct = Math.min(100, pct + rand(1, 3.5));
    bar.style.width = pct + '%';
    status.textContent = steps[Math.min(steps.length - 1, Math.floor(pct / (100 / (steps.length - 1))))];
    if (pct >= 100) {
      clearInterval(load);
      btn.disabled = false;
      btn.querySelector('.btn-text').textContent = 'Toca para abrir tu regalo';
      btn.focus({ preventScroll: true });
    }
  }, 60);

  /* ---- 4. Secuencia de florecimiento ---- */
  btn.addEventListener('click', () => {
    $('triggerOverlay').classList.add('fade-out');
    if (CONFIG.musica) playSong();
    const T = reduce ? .2 : 1;
    setTimeout(() => $('stem').classList.add('grow'), 400 * T);
    setTimeout(() => $('leafLeft').classList.add('visible'), 1500 * T);
    setTimeout(() => $('leafRight').classList.add('visible'), 1800 * T);
    setTimeout(() => calyx.classList.add('visible'), 2100 * T);
    setTimeout(() => {
      head.classList.add('blooming');
      $('ambientLight').classList.add('visible');
    }, 2500 * T);
    setTimeout(() => { if (!reduce) $('roseWrapper').classList.add('rotating'); }, 5000 * T);
    setTimeout(() => {
      $('endText').classList.add('visible');
      if (!reduce) { confettiBurst(); startPetalRain(); }
    }, 5500 * T);
  }, { once: true });

  /* ---- 5. Pétalos y confeti (movimiento 100% CSS) ---- */
  const rain = $('fallingPetals');
  const petalColors = [['#bf0028', '#4e0008'], ['#9a001d', '#3d0008'], ['#ad0022', '#440007'], ['#ff5c85', '#8e0018']];
  const confettiColors = ['#f2c35b', '#ff7aa2', '#ffffff', '#ffc2d4', '#ff2e5e'];

  function drop(isConfetti, delay = 0) {
    const el = document.createElement('div');
    el.className = 'falling-petal' + (isConfetti ? ' confetti' : '');
    const [c1, c2] = isConfetti ? [confettiColors[Math.floor(rand(0, confettiColors.length))], ''] : petalColors[Math.floor(rand(0, petalColors.length))];
    el.style.cssText =
      `left:${rand(0, 100)}vw;top:-24px;` +
      `--fp-w:${isConfetti ? rand(6, 10) : rand(10, 16)}px;--fp-h:${isConfetti ? rand(10, 16) : rand(13, 20)}px;` +
      `--fp-c1:${c1};--fp-c2:${c2 || c1};` +
      `--f-dur:${rand(isConfetti ? 4 : 6, isConfetti ? 7 : 10)}s;--f-delay:${delay}s;` +
      `--s1:${rand(-60, 60)}px;--s2:${rand(-60, 60)}px;--s3:${rand(-60, 60)}px;--s4:${rand(-40, 40)}px`;
    el.addEventListener('animationend', () => el.remove(), { once: true });
    rain.appendChild(el);
  }
  function confettiBurst() { for (let i = 0; i < 70; i++) drop(true, rand(0, 1.5)); }
  function startPetalRain() {
    setInterval(() => { if (rain.childElementCount < 40) drop(Math.random() < .25); }, 420);
  }

  /* ---- 6. "Cumpleaños feliz" con Web Audio ---- */
  function playSong() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const N = { G4: 392, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3, F5: 698.5, G5: 784 };
      const notes = [["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],
                     ["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],
                     ["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",2],
                     ["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",3]];
      const beat = .45; let t = ctx.currentTime + 2.4;
      notes.forEach(([n, d]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = N[n];
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.22, t + .04);
        g.gain.exponentialRampToValueAtTime(.001, t + d * beat * .95);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + d * beat);
        t += d * beat;
      });
    } catch (e) {}
  }
})();
</script>
</body>
</html>
